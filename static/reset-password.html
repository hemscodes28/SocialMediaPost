<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Post Pilot.ai</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/public-theme.css?v=10">
</head>

<body>
    <div class="mesh-bg" aria-hidden="true">
        <div class="mesh-circle circle-1"></div>
        <div class="mesh-circle circle-2"></div>
    </div>

    <div class="pp-auth-page" style="grid-template-columns: 1fr; max-width: 520px; margin: 0 auto;">
        <div class="pp-auth-form-wrap" style="min-height: 100vh;">
            <div class="pp-auth-card">
                <a href="/static/login.html" class="pp-back-home"><i class="fas fa-arrow-left"></i> Back to Sign In</a>
                <div class="pp-logo" style="-webkit-text-fill-color: unset; background: none; color: var(--text-main);">
                    <i class="fas fa-paper-plane" style="-webkit-text-fill-color: var(--primary);"></i>
                    <span
                        style="background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">Post
                        Pilot.ai</span>
                </div>
                <p class="subtitle">Create a new password</p>

                <div id="resetLoading" class="status-msg" style="display:block; background: var(--surface-lighter); color: var(--text-dim);">
                    <i class="fas fa-spinner fa-spin"></i> Verifying reset link…
                </div>

                <div id="resetInvalid" style="display:none;">
                    <div class="status-msg error" id="resetInvalidMsg">This reset link is invalid or expired.</div>
                    <a href="/static/login.html" class="btn btn-primary btn-full" style="margin-top:16px;">Back to Sign In</a>
                    <a href="/static/login.html#forgot" class="btn btn-glass btn-full" style="margin-top:10px;">Request a new link</a>
                </div>

                <form id="resetPasswordForm" style="display:none;">
                    <p id="resetEmailHint" style="font-size:0.9rem; color:var(--text-dim); margin-bottom:20px;"></p>
                    <div class="form-group">
                        <label for="newPassword">New password</label>
                        <div class="password-wrap">
                            <input type="password" id="newPassword" required placeholder="••••••••"
                                autocomplete="new-password" minlength="6">
                            <button type="button" class="toggle-pw" id="toggleNewPw" aria-label="Toggle password visibility">
                                <svg id="eyeIconNew" viewBox="0 0 24 24">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm password</label>
                        <div class="password-wrap">
                            <input type="password" id="confirmPassword" required placeholder="••••••••"
                                autocomplete="new-password" minlength="6">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Update password</button>
                </form>

                <div id="status" class="status-msg"></div>
            </div>
        </div>
    </div>

    <script src="js/auth-validation.js?v=10"></script>
    <script type="module" src="js/reset-password-page.js?v=1"></script>
</body>

</html>
