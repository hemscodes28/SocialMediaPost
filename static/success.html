<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Successful</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 400px;
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
        }

        h1 {
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            display: inline-block;
            cursor: pointer;
            border: none;
        }
    </style>
</head>

<body>
    <div class="card">
        <span class="icon">✅</span>
        <h1 id="title">Connected!</h1>
        <p id="message">Your account has been successfully linked.</p>
        <button class="btn" onclick="window.close()">Close this window</button>
    </div>

    <script>
        // Notify parent window to refresh accounts
        if (window.opener) {
            window.opener.postMessage('platform_connected', '*');
        }
        const params = new URLSearchParams(window.location.search);
        const count = parseInt(params.get('count') || '1', 10);
        const names = (params.get('names') || '').split(',').filter(Boolean);
        const platform = params.get('platform') || 'account';

        if (platform === 'instagram' && names.length) {
            const label = names.map((n) => '@' + n.replace(/^@/, '')).join(', ');
            document.getElementById('title').textContent = count > 1 ? 'Accounts connected!' : 'Instagram connected!';
            document.getElementById('message').textContent =
                count > 1
                    ? `Linked ${count} accounts: ${label}. Close this window — your list will refresh.`
                    : `Linked ${label}. Close this window — your list will refresh.`;
        } else if (platform === 'threads' && names.length) {
            const label = names.map((n) => '@' + n.replace(/^@/, '')).join(', ');
            document.getElementById('title').textContent = count > 1 ? 'Accounts connected!' : 'Threads connected!';
            document.getElementById('message').textContent =
                count > 1
                    ? `Linked ${count} Threads accounts: ${label}. Close this window — your list will refresh.`
                    : `Linked Threads account ${label}. Close this window — your list will refresh.`;
        } else if (platform === 'linkedin') {
            const label = names.join(', ') || 'LinkedIn Account';
            document.getElementById('title').textContent = 'LinkedIn connected!';
            document.getElementById('message').textContent = `Linked ${label}. Close this window — your list will refresh.`;
        } else {
            document.getElementById('message').textContent =
                'You can close this window and return to Post Pilot.ai.';
        }

        setTimeout(() => {
            window.close();
        }, 3500);
    </script>
</body>

</html>
