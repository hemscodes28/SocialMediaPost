<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Post Pilot.ai — Let's Get Started</title>
    <meta name="description" content="Tell us a bit about yourself so we can personalize your Post Pilot experience.">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #F9FAFB;
            --surface: #FFFFFF;
            --primary: #000000;
            --accent: #2563eb;
            --accent2: #7c3aed;
            --text-main: #111827;
            --text-dim: #4B5563;
            --border: rgba(0, 0, 0, 0.08);
            --success: #10b981;
            --error: #ef4444;
            --radius: 20px;
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Background blobs */
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
            animation: blobFloat 20s ease-in-out infinite alternate;
        }
        .blob1 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(99,102,241,0.18), transparent 70%);
            top: -100px; right: -80px;
        }
        .blob2 {
            width: 450px; height: 450px;
            background: radial-gradient(circle, rgba(6,182,212,0.15), transparent 70%);
            bottom: -80px; left: -80px;
            animation-delay: -8s;
        }
        @keyframes blobFloat {
            0% { transform: translate(0,0) scale(1); }
            100% { transform: translate(30px,40px) scale(1.08); }
        }

        /* Main container */
        .onboarding-wrap {
            position: relative;
            z-index: 1;
            width: min(680px, 96vw);
            padding: 20px 0 40px;
        }

        /* Logo */
        .ob-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.35rem;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #000, #2563eb);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 32px;
            justify-content: center;
        }
        .ob-logo i {
            -webkit-text-fill-color: #2563eb;
            background: none;
            font-size: 1.5rem;
        }

        /* Progress bar */
        .progress-bar-wrap {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            justify-content: center;
        }
        .progress-dot {
            flex: 1;
            max-width: 80px;
            height: 5px;
            border-radius: 99px;
            background: #e5e7eb;
            transition: var(--transition);
            overflow: hidden;
            position: relative;
        }
        .progress-dot.active::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            border-radius: 99px;
            animation: progressFill 0.4s ease-out forwards;
        }
        .progress-dot.done::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #10b981, #2563eb);
            border-radius: 99px;
        }
        @keyframes progressFill {
            from { transform: scaleX(0); transform-origin: left; }
            to { transform: scaleX(1); transform-origin: left; }
        }

        /* Card */
        .ob-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: clamp(32px, 5vw, 52px) clamp(28px, 5vw, 52px);
            box-shadow: 0 24px 56px rgba(0,0,0,0.06);
            animation: fadeUp 0.5s ease-out;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Step heading */
        .step-emoji {
            font-size: 2.6rem;
            text-align: center;
            display: block;
            margin-bottom: 16px;
            animation: bounceIn 0.5s ease-out;
        }
        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .step-title {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.5rem, 3vw, 2rem);
            font-weight: 800;
            text-align: center;
            margin-bottom: 8px;
            line-height: 1.2;
        }
        .step-subtitle {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.95rem;
            margin-bottom: 36px;
        }

        /* Option grid */
        .option-grid {
            display: grid;
            gap: 12px;
        }
        .option-grid.cols-2 {
            grid-template-columns: 1fr 1fr;
        }

        .option-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            border: 2px solid var(--border);
            border-radius: 16px;
            background: var(--bg);
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
            position: relative;
            overflow: hidden;
        }
        .option-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(37,99,235,0.04), rgba(124,58,237,0.03));
            opacity: 0;
            transition: opacity 0.3s;
        }
        .option-card:hover {
            border-color: rgba(37,99,235,0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(37,99,235,0.08);
        }
        .option-card:hover::before { opacity: 1; }

        .option-card.selected {
            border-color: #2563eb;
            background: rgba(37,99,235,0.04);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        }
        .option-card.selected::before { opacity: 1; }

        .option-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            background: rgba(37,99,235,0.08);
            flex-shrink: 0;
            transition: var(--transition);
        }
        .option-card.selected .option-icon {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: #fff;
        }

        .option-text { flex: 1; }
        .option-text strong {
            display: block;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2px;
        }
        .option-text span {
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .option-check {
            width: 22px; height: 22px;
            border-radius: 50%;
            border: 2px solid var(--border);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            color: #fff;
            font-size: 0.7rem;
        }
        .option-card.selected .option-check {
            background: #2563eb;
            border-color: #2563eb;
        }

        /* Navigation */
        .ob-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 36px;
            gap: 16px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-dim);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-back:hover {
            color: var(--text-main);
            border-color: rgba(0,0,0,0.2);
            transform: translateX(-3px);
        }

        .btn-next {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #000, #2563eb);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 8px 24px rgba(37,99,235,0.28);
            flex: 1;
            justify-content: center;
            max-width: 260px;
            margin-left: auto;
        }
        .btn-next:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 40px rgba(37,99,235,0.35);
        }
        .btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Step counter label */
        .step-label {
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-dim);
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* Welcome screen */
        .welcome-hero {
            text-align: center;
            padding: 12px 0 4px;
        }
        .welcome-hero .big-emoji {
            font-size: 4rem;
            display: block;
            margin-bottom: 20px;
            animation: bounceIn 0.6s ease-out;
        }
        .welcome-hero h1 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.8rem, 4vw, 2.4rem);
            font-weight: 800;
            margin-bottom: 12px;
            line-height: 1.15;
        }
        .gradient-text {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .welcome-hero p {
            color: var(--text-dim);
            font-size: 1rem;
            max-width: 420px;
            margin: 0 auto 32px;
            line-height: 1.6;
        }
        .welcome-pillars {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 32px;
        }
        .pillar {
            padding: 20px 12px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--bg);
            transition: var(--transition);
        }
        .pillar:hover {
            border-color: rgba(37,99,235,0.25);
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(37,99,235,0.08);
        }
        .pillar .picon { font-size: 1.8rem; margin-bottom: 10px; display: block; }
        .pillar strong { font-size: 0.85rem; font-weight: 700; display: block; margin-bottom: 4px; }
        .pillar span { font-size: 0.75rem; color: var(--text-dim); }

        /* Final celebration */
        .celebration {
            text-align: center;
            padding: 12px 0;
        }
        .celebration .big-emoji {
            font-size: 4rem;
            display: block;
            margin-bottom: 20px;
            animation: bounceIn 0.6s ease-out;
        }
        .celebration h2 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.6rem, 3.5vw, 2.2rem);
            font-weight: 800;
            margin-bottom: 12px;
        }
        .celebration p {
            color: var(--text-dim);
            font-size: 0.95rem;
            margin-bottom: 28px;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
        }
        .summary-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 32px;
        }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(37,99,235,0.07);
            border: 1px solid rgba(37,99,235,0.18);
            border-radius: 100px;
            font-size: 0.82rem;
            font-weight: 600;
            color: #2563eb;
        }
        .chip i { font-size: 0.75rem; }

        /* Loading spinner inside btn */
        .spin {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 540px) {
            .option-grid.cols-2 { grid-template-columns: 1fr; }
            .welcome-pillars { grid-template-columns: 1fr; }
            .ob-card { padding: 28px 20px; }
            .btn-next { max-width: none; }
        }
    </style>
</head>

<body>
    <div class="bg-blob blob1"></div>
    <div class="bg-blob blob2"></div>

    <div class="onboarding-wrap">
        <!-- Logo -->
        <div class="ob-logo">
            <i class="fas fa-paper-plane"></i>
            <span>Post Pilot.ai</span>
        </div>

        <!-- Progress bar (shown on question steps) -->
        <div class="progress-bar-wrap" id="progressBar" style="display:none;">
            <div class="progress-dot" id="dot0"></div>
            <div class="progress-dot" id="dot1"></div>
        </div>

        <!-- Step label -->
        <div class="step-label" id="stepLabel" style="display:none;"></div>

        <!-- Card -->
        <div class="ob-card" id="obCard">
            <!-- Steps rendered by JS -->
        </div>
    </div>

    <script>
    (function () {
        // ── Auth guard: must be logged in ──────────────────────────────
        const token = localStorage.getItem('access_token');
        if (!token) {
            window.location.replace('/static/login.html');
            return;
        }

        // ── State ──────────────────────────────────────────────────────
        const answers = { role: null, platforms: [], goal: null };
        let currentStep = 0; // 0 = welcome, 1 = Q1, 2 = Q2, 3 = done
        const TOTAL_QUESTIONS = 2;

        // ── DOM helpers ────────────────────────────────────────────────
        const card = document.getElementById('obCard');
        const progressBar = document.getElementById('progressBar');
        const stepLabel = document.getElementById('stepLabel');
        const dots = [document.getElementById('dot0'), document.getElementById('dot1')];

        function updateProgress(qIndex) {
            // qIndex: 0-based index of the current question
            dots.forEach((d, i) => {
                d.className = 'progress-dot';
                if (i < qIndex) d.classList.add('done');
                else if (i === qIndex) d.classList.add('active');
            });
            stepLabel.textContent = `Step ${qIndex + 1} of ${TOTAL_QUESTIONS}`;
        }

        function animateCard() {
            card.style.animation = 'none';
            // Force reflow
            void card.offsetHeight;
            card.style.animation = 'fadeUp 0.45s ease-out';
        }

        // ── Step renderers ─────────────────────────────────────────────

        function renderWelcome() {
            progressBar.style.display = 'none';
            stepLabel.style.display = 'none';
            card.innerHTML = `
                <div class="welcome-hero">
                    <span class="big-emoji">🚀</span>
                    <h1>Welcome to <span class="gradient-text">Post Pilot.ai</span></h1>
                    <p>We'll ask you 2 quick questions to personalise your experience. It takes under 30 seconds!</p>
                    <div class="welcome-pillars">
                        <div class="pillar">
                            <span class="picon">🤖</span>
                            <strong>AI Captions</strong>
                            <span>Write posts in seconds</span>
                        </div>
                        <div class="pillar">
                            <span class="picon">📅</span>
                            <strong>Smart Schedule</strong>
                            <span>Post at the perfect time</span>
                        </div>
                        <div class="pillar">
                            <span class="picon">🌐</span>
                            <strong>Multi-Platform</strong>
                            <span>Instagram, LinkedIn & more</span>
                        </div>
                    </div>
                    <button class="btn-next" id="welcomeNext" style="max-width:100%; width:100%;">
                        Get Started &nbsp;<i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            `;
            animateCard();
            document.getElementById('welcomeNext').addEventListener('click', () => {
                currentStep = 1;
                renderStep();
            });
        }

        function renderQ1() {
            progressBar.style.display = 'flex';
            stepLabel.style.display = 'block';
            updateProgress(0);
            card.innerHTML = `
                <span class="step-emoji">🧑‍💼</span>
                <div class="step-title">What best describes you?</div>
                <div class="step-subtitle">Help us tailor your Post Pilot experience.</div>
                <div class="option-grid" id="q1Options">
                    ${renderOptions([
                        { val: 'creator', icon: '🎨', label: 'Content Creator', desc: 'Building my personal brand' },
                        { val: 'business', icon: '🏢', label: 'Business Owner', desc: 'Marketing my products or services' },
                        { val: 'marketer', icon: '📊', label: 'Marketer / Agency', desc: 'Managing multiple clients or brands' },
                        { val: 'student', icon: '🎓', label: 'Student / Learner', desc: 'Learning social media management' },
                    ], 'q1')}
                </div>
                <div class="ob-nav">
                    <button class="btn-back" id="q1Back"><i class="fas fa-arrow-left"></i> Back</button>
                    <button class="btn-next" id="q1Next" disabled>Next <i class="fas fa-arrow-right"></i></button>
                </div>
            `;
            animateCard();
            bindOptions('q1', 'role', 'q1Next');
            document.getElementById('q1Back').addEventListener('click', () => { currentStep = 0; renderStep(); });
            document.getElementById('q1Next').addEventListener('click', () => { currentStep = 2; renderStep(); });
        }

        function renderQ2() {
            updateProgress(1);
            card.innerHTML = `
                <span class="step-emoji">🎯</span>
                <div class="step-title">What's your main goal?</div>
                <div class="step-subtitle">Pick the one that matters most right now.</div>
                <div class="option-grid" id="q2Options">
                    ${renderOptions([
                        { val: 'grow', icon: '📈', label: 'Grow my audience', desc: 'Reach more followers and fans' },
                        { val: 'engage', icon: '💬', label: 'Boost engagement', desc: 'More likes, comments, shares' },
                        { val: 'leads', icon: '🎯', label: 'Generate leads', desc: 'Drive traffic and conversions' },
                        { val: 'time', icon: '⏱️', label: 'Save time posting', desc: 'Automate my content workflow' },
                    ], 'q2')}
                </div>
                <div class="ob-nav">
                    <button class="btn-back" id="q2Back"><i class="fas fa-arrow-left"></i> Back</button>
                    <button class="btn-next" id="q2Next" disabled>Finish <i class="fas fa-check"></i></button>
                </div>
            `;
            animateCard();
            bindOptions('q2', 'goal', 'q2Next');
            document.getElementById('q2Back').addEventListener('click', () => { currentStep = 1; renderStep(); });
            document.getElementById('q2Next').addEventListener('click', () => { currentStep = 3; renderStep(); });
        }

        function renderDone() {
            progressBar.style.display = 'none';
            stepLabel.style.display = 'none';

            const roleLabels = {
                creator: '🎨 Content Creator', business: '🏢 Business Owner',
                marketer: '📊 Marketer / Agency', student: '🎓 Student / Learner'
            };
            const goalLabels = {
                grow: '📈 Grow audience', engage: '💬 Boost engagement',
                leads: '🎯 Generate leads', time: '⏱️ Save time'
            };

            card.innerHTML = `
                <div class="celebration">
                    <span class="big-emoji">🎉</span>
                    <h2>You're all set, <span class="gradient-text">let's go!</span></h2>
                    <p>Your workspace is ready. Start creating amazing posts and growing your audience today.</p>
                    <div class="summary-chips">
                        ${answers.role ? `<div class="chip"><i class="fas fa-user"></i> ${roleLabels[answers.role] || answers.role}</div>` : ''}
                        ${answers.goal ? `<div class="chip"><i class="fas fa-bullseye"></i> ${goalLabels[answers.goal] || answers.goal}</div>` : ''}
                    </div>
                    <button class="btn-next" id="doneBtn" style="max-width:100%; width:100%;">
                        <span id="doneBtnLabel">Open My Dashboard &nbsp;<i class="fas fa-rocket"></i></span>
                    </button>
                </div>
            `;
            animateCard();
            document.getElementById('doneBtn').addEventListener('click', goToDashboard);
        }

        function renderStep() {
            if (currentStep === 0) renderWelcome();
            else if (currentStep === 1) renderQ1();
            else if (currentStep === 2) renderQ2();
            else renderDone();
        }

        // ── Options helper ─────────────────────────────────────────────
        function renderOptions(items, groupId) {
            return items.map(item => `
                <div class="option-card" data-group="${groupId}" data-val="${item.val}" id="${groupId}-${item.val}" role="button" tabindex="0">
                    <div class="option-icon">${item.icon}</div>
                    <div class="option-text">
                        <strong>${item.label}</strong>
                        <span>${item.desc}</span>
                    </div>
                    <div class="option-check"><i class="fas fa-check"></i></div>
                </div>
            `).join('');
        }

        function bindOptions(groupId, answerKey, nextBtnId) {
            const cards = document.querySelectorAll(`[data-group="${groupId}"]`);
            const nextBtn = document.getElementById(nextBtnId);

            // Restore previous selection if any
            if (answers[answerKey]) {
                const prev = document.getElementById(`${groupId}-${answers[answerKey]}`);
                if (prev) prev.classList.add('selected');
                if (nextBtn) nextBtn.disabled = false;
            }

            cards.forEach(c => {
                const activate = () => {
                    cards.forEach(x => x.classList.remove('selected'));
                    c.classList.add('selected');
                    answers[answerKey] = c.dataset.val;
                    if (nextBtn) nextBtn.disabled = false;
                };
                c.addEventListener('click', activate);
                c.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') activate(); });
            });
        }

        // ── Final redirect ─────────────────────────────────────────────
        function goToDashboard() {
            const btn = document.getElementById('doneBtn');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<div class="spin"></div> &nbsp;Opening dashboard…';
            }
            // Save answers to localStorage for future personalisation
            try {
                localStorage.setItem('pp_onboarding', JSON.stringify(answers));
            } catch (e) { /* ignore */ }
            // Clear new user flag
            localStorage.removeItem('is_new_user');
            // Redirect to dashboard
            setTimeout(() => {
                window.location.replace('/static/index.html?tab=profile');
            }, 700);
        }

        // ── Start ──────────────────────────────────────────────────────
        renderWelcome();
    })();
    </script>
</body>

</html>
